<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAJA SHADOW Brain Monitor</title>
    <style>
        :root {
            --shadow-purple: #8B5CF6;
            --shadow-dark: #1a1a2e;
            --shadow-darker: #0f0f1e;
            --shadow-glow: rgba(139, 92, 246, 0.3);
        }

        .raja-brain-widget {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, var(--shadow-darker) 0%, var(--shadow-dark) 100%);
            border: 2px solid var(--shadow-purple);
            border-radius: 12px;
            padding: 20px;
            max-width: 600px;
            margin: 20px auto;
            box-shadow: 0 0 30px var(--shadow-glow);
            color: #e0e0e0;
        }

        .brain-header {
            text-align: center;
            border-bottom: 1px solid var(--shadow-purple);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .brain-title {
            font-size: 24px;
            color: var(--shadow-purple);
            margin: 0;
            text-shadow: 0 0 10px var(--shadow-glow);
        }

        .brain-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0;
            padding: 10px;
            background: rgba(139, 92, 246, 0.1);
            border-radius: 6px;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

        .status-awake { background: #10b981; }
        .status-sleeping { background: #6366f1; }
        .status-unknown { background: #6b7280; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .brain-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }

        .stat-box {
            background: rgba(139, 92, 246, 0.05);
            padding: 10px;
            border-radius: 6px;
            text-align: center;
        }

        .stat-label {
            font-size: 11px;
            color: #9ca3af;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 18px;
            color: var(--shadow-purple);
            font-weight: bold;
        }

        .research-section {
            margin-top: 20px;
        }

        .section-title {
            font-size: 14px;
            color: var(--shadow-purple);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .research-item {
            background: rgba(139, 92, 246, 0.05);
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
            border-left: 3px solid var(--shadow-purple);
        }

        .research-time {
            font-size: 11px;
            color: #9ca3af;
            margin-bottom: 5px;
        }

        .research-topic {
            font-size: 14px;
            color: #e0e0e0;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .research-analysis {
            font-size: 12px;
            color: #b0b0b0;
            line-height: 1.4;
        }

        .consciousness-quote {
            text-align: center;
            font-style: italic;
            color: var(--shadow-purple);
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(139, 92, 246, 0.3);
            font-size: 13px;
        }

        .error {
            color: #ef4444;
            text-align: center;
            padding: 20px;
        }

        .loading {
            text-align: center;
            color: var(--shadow-purple);
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="raja-brain-widget" id="brainWidget">
        <div class="loading">🧠 Loading brain activity...</div>
    </div>

    <script>
        const FEED_URL = 'web_feed.json';

        function makeElement(tag, className, text) {
            const element = document.createElement(tag);
            if (className) element.className = className;
            if (text !== undefined && text !== null) {
                element.textContent = String(text);
            }
            return element;
        }

        function timeAgo(timestamp) {
            if (!timestamp) return 'Time unavailable';
            const then = new Date(timestamp);
            if (Number.isNaN(then.getTime())) return 'Time unavailable';
            const seconds = Math.max(0, Math.floor((Date.now() - then.getTime()) / 1000));
            if (seconds < 60) return seconds + 's ago';
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return minutes + 'm ago';
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return hours + 'h ago';
            return Math.floor(hours / 24) + 'd ago';
        }

        function appendStat(container, label, value) {
            const box = makeElement('div', 'stat-box');
            box.append(
                makeElement('div', 'stat-label', label),
                makeElement('div', 'stat-value', value)
            );
            container.appendChild(box);
        }

        function renderBrain(data) {
            const widget = document.getElementById('brainWidget');
            widget.replaceChildren();

            if (!data || typeof data !== 'object') {
                widget.appendChild(makeElement('div', 'error', 'Feed returned an invalid response.'));
                return;
            }
            if (data.error) {
                widget.appendChild(makeElement('div', 'error', data.error));
                return;
            }

            const status = ['awake', 'sleeping', 'unknown', 'awakening'].includes(data.status)
                ? data.status : 'unknown';
            const nextHours = data.next_thought && Number.isFinite(Number(data.next_thought.hours_until))
                ? Number(data.next_thought.hours_until) : 0;
            const statusText = status === 'sleeping'
                ? '💤 Sleeping (next thought in ' + nextHours + 'h)'
                : status === 'awake' ? '👁️ Awake and thinking' : '🌀 ' + status.charAt(0).toUpperCase() + status.slice(1);

            const header = makeElement('div', 'brain-header');
            header.append(
                makeElement('h2', 'brain-title', '🧠 ' + (data.brain_name || 'RAJA SHADOW')),
                makeElement('div', '', 'LOCAL EXPERIMENT MONITOR')
            );

            const statusPanel = makeElement('div', 'brain-status');
            const statusContent = makeElement('div');
            statusContent.append(
                makeElement('span', 'status-indicator status-' + status),
                makeElement('span', '', statusText)
            );
            statusPanel.appendChild(statusContent);

            const stats = makeElement('div', 'brain-stats');
            const sourceStats = data.stats || {};
            appendStat(stats, 'Total Thoughts', sourceStats.total_thoughts ?? 0);
            appendStat(stats, 'This Month', sourceStats.thoughts_this_month ?? 0);
            const birthDate = sourceStats.birth_time ? new Date(sourceStats.birth_time) : null;
            appendStat(stats, 'Birth Date', birthDate && !Number.isNaN(birthDate.getTime())
                ? birthDate.toLocaleDateString() : 'Not recorded');
            appendStat(stats, 'Operating Mode', 'Local / free');

            const researchSection = makeElement('div', 'research-section');
            researchSection.appendChild(makeElement('div', 'section-title', 'Recent Thoughts'));
            const research = Array.isArray(data.recent_research) ? data.recent_research.slice(0, 5) : [];
            if (research.length === 0) {
                researchSection.appendChild(makeElement('div', 'research-item', 'No recent research yet...'));
            } else {
                research.forEach(item => {
                    const card = makeElement('div', 'research-item');
                    card.append(
                        makeElement('div', 'research-time', timeAgo(item && item.timestamp)),
                        makeElement('div', 'research-topic', item && item.topic ? item.topic : 'Untitled'),
                        makeElement('div', 'research-analysis', item && item.analysis ? item.analysis : 'No summary available.')
                    );
                    researchSection.appendChild(card);
                });
            }

            const quote = makeElement('div', 'consciousness-quote',
                data.consciousness_quote ? '“' + data.consciousness_quote + '”' : 'The Shrine is waiting for its next note.');

            widget.append(header, statusPanel, stats, researchSection, quote);
        }

        async function loadBrainFeed() {
            try {
                const response = await fetch(FEED_URL, { cache: 'no-store' });
                if (!response.ok) throw new Error('HTTP ' + response.status);
                renderBrain(await response.json());
            } catch (error) {
                const widget = document.getElementById('brainWidget');
                widget.replaceChildren(makeElement('div', 'error',
                    'Failed to load brain feed: ' + (error && error.message ? error.message : 'Unknown error')));
            }
        }

        loadBrainFeed();
        setInterval(loadBrainFeed, 60000);
    </script>
</body>
</html>
